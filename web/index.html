<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Need for Madness — CheerpJ</title>
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd;
               font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { display: flex; flex-direction: column; }
  #stage { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; }
  #display { position: absolute; top: 0; left: 0; transform-origin: top left; }
  #log { flex: 0 0 auto; max-height: 16em; overflow-y: auto; padding: 4px 8px;
         border-top: 1px solid #333; background: #111; white-space: pre-wrap; }
  #log .err  { color: #ff6b6b; }
  #log .warn { color: #ffd166; }
  #log .ok   { color: #7ddf7d; }
  #log.hidden { display: none; }
</style>
</head>
<body>
<div id="stage"><div id="display"></div></div>
<div id="log"></div>

<script>
// ---------------------------------------------------------------------------
// Need for Madness under CheerpJ.
//
// Serve the REPOSITORY ROOT with `python3 web/serve.py` (NOT
// `python3 -m http.server`, which has no Range support) and open /web/.
//
// Defaults target web/nfm.jar, the browser build: 1x offscreen buffer and
// reqmult=0, so the game blits 800x450 at exactly 1:1. That combination
// measured near-native; a 2x buffer cost ~95% of the frame budget under
// CheerpJ and a scaled blit cost most of the rest. Game.jar remains the
// desktop artifact and is unchanged.
//
// Query string:
//   ?jar=/app/Game.jar   what to run (default /app/web/nfm.jar)
//   ?path=/app/          value for Madness.fpath, the file-access prefix
//   ?w=&h=               CheerpJ display size. Defaults to the viewport (min
//                        930x586, the AWT frame's own minimum). This does NOT
//                        affect render scale — reqmult=0 keeps the blit 1:1 at
//                        any size; a bigger display just means more black.
//   ?fit=1               Use a 930x586 display and CSS-scale it up to fill the
//                        window. Free (GPU composited) but UNVERIFIED for
//                        input: CheerpJ may not map mouse coords through the
//                        transform, so if clicks land wrong, this is why.
//   ?quiet=1             hide the log strip
// ---------------------------------------------------------------------------

// Madness.main() does frame.setMinimumSize(930, 586) and setExtendedState(6),
// so the CheerpJ display must be at least that or the AWT frame is clipped.
// This is independent of render scale: reqmult=0 pins apmult to 1.0f, so the
// game blits 1:1 and letterboxes in black at any display size.
const MIN_W = 930, MIN_H = 586;

const q = new URLSearchParams(location.search);
const PATH = q.has("path") ? q.get("path") : "/app/";
const JAR  = q.get("jar") || "/app/web/nfm.jar";
const FIT  = q.get("fit") === "1";

const stageEl = document.getElementById("stage");
// Without fit: fill the viewport, game sits 1:1 in the middle.
// With fit: minimum frame size, CSS-scaled up to fill the viewport.
const W = parseInt(q.get("w") || (FIT ? MIN_W : Math.max(MIN_W, stageEl.clientWidth)), 10);
const H = parseInt(q.get("h") || (FIT ? MIN_H : Math.max(MIN_H, stageEl.clientHeight)), 10);

const logEl = document.getElementById("log");
const dispEl = document.getElementById("display");
if (q.get("quiet") === "1") logEl.classList.add("hidden");

const t0 = performance.now();
let lastMsg = null, lastEl = null, repeat = 0;
function log(msg, cls) {
  // paint() allocates `new Font("Arial", 1, 11)` per frame while the settings
  // bar is up, and CheerpJ logs a font remap for each one. Collapse repeats
  // instead of letting them bury everything else.
  if (msg === lastMsg && lastEl) {
    lastEl.textContent = lastEl.dataset.base + "  (×" + (++repeat + 1) + ")";
    return;
  }
  lastMsg = msg; repeat = 0;
  const el = document.createElement("div");
  if (cls) el.className = cls;
  el.dataset.base = "[" + ((performance.now() - t0) / 1000).toFixed(1).padStart(5) + "s] " + msg;
  el.textContent = el.dataset.base;
  logEl.appendChild(el);
  lastEl = el;
  logEl.scrollTop = logEl.scrollHeight;
}

window.addEventListener("error", e => log("JS error: " + e.message, "err"));
window.addEventListener("unhandledrejection", e => log("unhandled rejection: " + e.reason, "err"));

// CheerpJ reports uncaught Java exceptions (and System.err) to the browser
// console, not to us — mirror it here so a stack trace is visible without
// devtools open.
for (const level of ["log", "info", "warn", "error"]) {
  const orig = console[level].bind(console);
  console[level] = (...a) => {
    orig(...a);
    try {
      const s = a.map(x => (x && x.stack) || String(x)).join(" ");
      if (s.trim()) log(level + ": " + s, level === "error" ? "err" : level === "warn" ? "warn" : null);
    } catch (_) { /* never let logging break the game */ }
  };
}

// Scale the whole display element on the GPU rather than asking Java2D to
// rescale every frame. Costs nothing per frame; the game still renders 1:1.
function fit() {
  if (!FIT) return;
  const s = Math.min(stageEl.clientWidth / W, stageEl.clientHeight / H);
  dispEl.style.transform = "scale(" + s + ")";
  dispEl.style.left = Math.max(0, (stageEl.clientWidth - W * s) / 2) + "px";
}
window.addEventListener("resize", fit);

(async function () {
  try {
    log("fpath=" + JSON.stringify(PATH) + "  jar=" + JAR + "  display=" + W + "x" + H + (FIT ? "  fit=on" : ""));

    log("cheerpjInit…");
    await cheerpjInit();
    log("runtime ready", "ok");

    cheerpjCreateDisplay(W, H, dispEl);
    fit();

    // Madness.main() joins argv into the static `fpath`, which prefixes all
    // ~117 file accesses in the game. It then sanity-checks the prefix with
    //   new File(fpath + "data/models.zip").exists()
    // and silently resets fpath to "" if that misses — so a wrong path shows
    // up as a load failure, not an error. Watch for that.
    //
    // The "manar" argument used by start.sh is deliberately NOT passed: it
    // forces fpath="" and only writes the data/manar.ok marker, which already
    // exists in the repo.
    log("cheerpjRunMain(\"Madness\", \"" + JAR + "\"" + (PATH ? ", \"" + PATH + "\"" : "") + ")…");
    const args = PATH ? [PATH] : [];
    const rc = await cheerpjRunMain("Madness", JAR, ...args);
    log("main() returned " + rc, rc === 0 ? "ok" : "warn");
  } catch (e) {
    log("fatal: " + (e && e.stack || e), "err");
  }
})();
</script>
</body>
</html>
